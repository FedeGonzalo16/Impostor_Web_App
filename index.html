<html lang="es-AR">
  <head>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Cómo se ve el link al pegarlo en WhatsApp/Twitter. Sin imagen: no
         hay una alojada todavía y una genérica de stock no suma nada. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="El Impostor · anotador de juntada" />

    <meta name="twitter:card" content="summary" />

    <meta name="twitter:description" content="El impostor: juego de juntada. Un teléfono, una palabra, un mentiroso." />
    <style>
      /* Mismo fondo "madera" que .mesa (ver src/estilos.css), repetido acá
         para que cuando el navegador asome el área fuera del documento
         (rebote elástico al final del scroll en iOS, pull-to-refresh en
         Chrome) se vea la misma textura y no un color plano distinto,
         que se notaba como una franja de otro tono arriba/abajo. */
      html, body {
        margin: 0; padding: 0;
        background-color: #8C6540;
        background-image:
          repeating-linear-gradient(89deg, rgba(255,241,214,.07) 0 3px, transparent 3px 9px),
          repeating-linear-gradient(89deg, rgba(0,0,0,.06) 0 1px, transparent 1px 46px),
          radial-gradient(55% 38% at 18% 28%, rgba(0,0,0,.15) 0%, transparent 62%),
          radial-gradient(48% 34% at 82% 78%, rgba(0,0,0,.13) 0%, transparent 62%),
          linear-gradient(165deg, #B98554 0%, #74502D 100%);
        background-attachment: fixed;
        -webkit-text-size-adjust: 100%;
      }
      body { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
